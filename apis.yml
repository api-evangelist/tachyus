image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/tachyus.png
name: Tachyus
description: >-
  Tachyus provides AI-powered operational optimization and greenhouse-gas
  emissions management software for the energy and industrial sectors,
  combining data, reservoir physics, and machine learning. Its Tachapps
  platform spans Strateon (production and injection allocation), Aqueon
  (conventional reservoir management and optimization), and Aurion (GHG
  emissions accounting, monitoring, forecasting, and regulatory reporting).
  The Tachapps REST API (v1) is organized around Projects, Wells, and
  Production Data, using Bearer API-token authentication with scopes, JSON
  over HTTPS, cursor-based pagination, and per-plan rate limits.
