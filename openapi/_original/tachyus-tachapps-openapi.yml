openapi: 3.1.0
x-apievangelist:
  generated: '2026-07-21'
  method: generated
  source: >-
    Faithfully transcribed from the published Tachapps API reference at
    https://docs.tachyus.com/api/ (introduction, authentication, projects,
    wells, production-data). No fields invented; only documented operations,
    parameters, and response fields are represented.
info:
  title: Tachapps API
  version: v1
  description: >-
    REST API for the Tachyus Tachapps platform (Strateon, Aqueon, Aurion) —
    reservoir management, production analytics, and forecasting. The API is
    organized around Projects, Wells, and Production Data. All requests use
    HTTPS and JSON. Authentication is a Bearer API token issued from the
    Tachapps UI (Settings -> API Tokens). Breaking changes are introduced only
    in new major versions with advance notice.
  contact:
    name: Tachyus
    email: info@tachyus.com
    url: https://docs.tachyus.com/
servers:
  - url: https://{organization}.tachyus.com/api/v1
    description: Per-organization production host
    variables:
      organization:
        default: your-organization
        description: Your Tachapps organization subdomain
security:
  - bearerAuth: []
tags:
  - name: Projects
    description: Projects map to a specific geographic or operational asset.
  - name: Wells
    description: Wells belong to projects.
  - name: Production Data
    description: Daily/monthly production records for a well.
paths:
  /projects:
    get:
      operationId: listProjects
      tags: [Projects]
      summary: List projects
      description: Returns a paginated list of projects the authenticated user has access to.
      parameters:
        - name: limit
          in: query
          description: 'Max results per page (default: 50, max: 200)'
          schema: { type: integer, default: 50, maximum: 200 }
        - name: cursor
          in: query
          description: Pagination cursor from previous response
          schema: { type: string }
      responses:
        '200':
          description: A page of projects
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Project' }
                  nextCursor: { type: string, nullable: true }
                  total: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      operationId: createProject
      tags: [Projects]
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, description, timezone, unitSystem]
              properties:
                name: { type: string }
                description: { type: string }
                timezone: { type: string }
                unitSystem: { type: string }
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /projects/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Project ID
        schema: { type: string }
    get:
      operationId: getProject
      tags: [Projects]
      summary: Retrieve a project
      responses:
        '200':
          description: Project object
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
    patch:
      operationId: updateProject
      tags: [Projects]
      summary: Update project metadata
      description: Partially update project metadata; only included fields are modified.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
                unitSystem: { type: string }
      responses:
        '200':
          description: Updated project object
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      operationId: deleteProject
      tags: [Projects]
      summary: Delete a project
      description: >-
        Deleting a project permanently removes all associated wells, production
        data, dashboards, and surfaces.
      responses:
        '204': { description: Project deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /projects/{projectId}/wells:
    parameters:
      - name: projectId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: listWells
      tags: [Wells]
      summary: List wells in a project
      parameters:
        - name: limit
          in: query
          description: 'Max results per page (default: 100)'
          schema: { type: integer, default: 100 }
        - name: cursor
          in: query
          schema: { type: string }
        - name: type
          in: query
          description: 'Filter by type'
          schema: { type: string, enum: [producer, injector, observer, swd] }
        - name: status
          in: query
          description: 'Filter by status'
          schema: { type: string, enum: [active, inactive, shut_in] }
        - name: search
          in: query
          description: Search by well name or API number
          schema: { type: string }
      responses:
        '200':
          description: A page of wells
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Well' }
                  nextCursor: { type: string, nullable: true }
                  total: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      operationId: createWell
      tags: [Wells]
      summary: Create a well
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WellInput' }
      responses:
        '201':
          description: Well created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Well' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /projects/{projectId}/wells/{wellId}:
    parameters:
      - name: projectId
        in: path
        required: true
        schema: { type: string }
      - name: wellId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getWell
      tags: [Wells]
      summary: Get a well by ID
      responses:
        '200':
          description: Well object
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Well' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
    patch:
      operationId: updateWell
      tags: [Wells]
      summary: Update well attributes
      description: Update well attributes. Only included fields are modified.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WellInput' }
      responses:
        '200':
          description: Updated well object
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Well' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      operationId: deleteWell
      tags: [Wells]
      summary: Delete a well
      description: >-
        Deletes the well and all associated production data. This action cannot
        be undone.
      responses:
        '204': { description: Well deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /projects/{projectId}/wells/{wellId}/production:
    parameters:
      - name: projectId
        in: path
        required: true
        schema: { type: string }
      - name: wellId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getProductionData
      tags: [Production Data]
      summary: Get production data for a well
      parameters:
        - name: from
          in: query
          required: true
          description: Start date (inclusive)
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          description: End date (inclusive)
          schema: { type: string, format: date }
        - name: fields
          in: query
          description: Comma-separated list of fields to return
          schema: { type: string }
        - name: aggregation
          in: query
          description: Daily (default) or monthly aggregation
          schema: { type: string, enum: [daily, monthly], default: daily }
      responses:
        '200':
          description: Production data series
          content:
            application/json:
              schema:
                type: object
                properties:
                  wellId: { type: string }
                  from: { type: string, format: date }
                  to: { type: string, format: date }
                  aggregation: { type: string }
                  fields: { type: array, items: { type: string } }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ProductionRecord' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      operationId: ingestProductionData
      tags: [Production Data]
      summary: Ingest production records
      description: >-
        Existing records for the same date are upserted (replaced). For
        historical imports exceeding thousands of records, CSV import or bulk
        data migration is recommended.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [records]
              properties:
                records:
                  type: array
                  items: { $ref: '#/components/schemas/ProductionRecord' }
      responses:
        '200':
          description: Ingest result
          content:
            application/json:
              schema:
                type: object
                properties:
                  inserted: { type: integer }
                  updated: { type: integer }
                  total: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      operationId: deleteProductionData
      tags: [Production Data]
      summary: Delete production records by date range
      parameters:
        - name: from
          in: query
          required: true
          description: Start of range to delete (inclusive)
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          description: End of range to delete (inclusive)
          schema: { type: string, format: date }
      responses:
        '200':
          description: Delete result
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        API token issued from the Tachapps UI (Settings -> API Tokens), sent as
        `Authorization: Bearer tach_live_...`. Tokens carry scopes
        (read:projects, read:wells, read:production, write:projects,
        write:wells, admin).
  responses:
    Unauthorized:
      description: Token missing or invalid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Token lacks required scope
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema: { type: integer }
          description: Seconds to wait before retrying
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Project:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        timezone: { type: string }
        unitSystem: { type: string }
        wellCount: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    WellInput:
      type: object
      properties:
        name: { type: string }
        apiNumber: { type: string }
        type: { type: string, enum: [producer, injector, observer, swd] }
        status: { type: string, enum: [active, inactive, shut_in] }
        latitude: { type: number }
        longitude: { type: number }
        spudDate: { type: string, format: date }
        lateralLength: { type: number }
        perfInterval:
          type: object
          properties:
            topMd: { type: number }
            bottomMd: { type: number }
    Well:
      allOf:
        - $ref: '#/components/schemas/WellInput'
        - type: object
          properties:
            id: { type: string }
            projectId: { type: string }
            firstProductionDate: { type: string, format: date }
            createdAt: { type: string, format: date-time }
    ProductionRecord:
      type: object
      properties:
        date: { type: string, format: date }
        oil_rate: { type: number }
        water_rate: { type: number }
        gas_rate: { type: number }
        bhp: { type: number }
        thp: { type: number }
        choke_size: { type: number }
        runtime: { type: number }
        gor: { type: number }
        watercut: { type: number }
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string }
